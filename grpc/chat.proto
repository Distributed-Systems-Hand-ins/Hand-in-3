syntax = "proto3";
package chat;

option go_package = "chatroom/grpc";


message User {
	string id = 1;
	string name = 2;
}

message Message {
	string sender = 1;
	string content = 2;
	int64 lamport = 3;
}

message Connect {
	User user = 1;
	int64 lamport = 2;
}

message Close {}

service Broadcast {
	rpc CreateStream(Connect) returns (stream Message);
	rpc BroadcastMessage(Message) returns (Close);
}

